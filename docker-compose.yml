# Afaq Automation Agency — development stack
# Usage: cp .env.example .env && cp backend/.env.example backend/.env && docker compose up -d --build
# See docs/06_testing_devops/deployment_docker.md

name: ${COMPOSE_PROJECT_NAME:-afaq}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afaq}
      POSTGRES_USER: ${POSTGRES_USER:-afaq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      AUTO_COMPOSER_INSTALL: "1"
    volumes: &backend-volumes
      - ./backend:/var/www/html
      # Linux-native volumes for the hot paths: bind-mounted vendor/ is ~50x slower on Windows/macOS
      - backend_vendor:/var/www/html/vendor
      - backend_framework:/var/www/html/storage/framework
      - composer_cache:/composer-cache
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a local Ollama instance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f vendor/autoload.php && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=600", "--sleep=2"]
    volumes: *backend-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Linux-native deps, isolated from the host's node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  pgdata:
  redisdata:
  backend_vendor:
  backend_framework:
  composer_cache:
