# Shared reverse-proxy headers for the Afaq containers (127.0.0.1 only).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (not append) so a client can't spoof its IP into Laravel's rate limiter
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# Read/send timeouts stay at nginx's 60s default; the SSE location raises them.
