# Temporary host nginx config for the FIRST certificate issue only (port 80, ACME webroot).
# The real site configs reference certificate files that don't exist yet, so nginx would refuse
# to start with them. Remove this file once both certificates are issued (see §9.3).
server {
    listen 80;
    listen [::]:80;
    server_name afaqn8n.me www.afaqn8n.me dashboard.afaqn8n.me;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}
