# Host nginx — Laravel API + Filament admin: https://dashboard.afaqn8n.me
# (the stack's "web" nginx container on 127.0.0.1:8080, which hands PHP to FPM)
# Install: see docs/06_testing_devops/deployment_docker.md §9.3

upstream afaq_web {
    server 127.0.0.1:8080;   # WEB_PORT in /var/www/afaq/afaqn8n/.env
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.afaqn8n.me;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dashboard.afaqn8n.me$request_uri; }
}

server {
    # `listen … ssl http2` works on Ubuntu's stock nginx (1.18 / 1.24)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.afaqn8n.me;

    ssl_certificate     /etc/letsencrypt/live/dashboard.afaqn8n.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.afaqn8n.me/privkey.pem;
    include snippets/afaq-ssl.conf;

    access_log /var/log/nginx/dashboard.afaqn8n.me.access.log;
    error_log  /var/log/nginx/dashboard.afaqn8n.me.error.log warn;

    # CV / avatar / cover uploads (Laravel validates 10 MB; PHP post_max_size is 12 MB)
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    # ── AI concierge: Server-Sent Events ─────────────────────────────────
    # No buffering, no compression, no caching: every token is flushed to the browser as it
    # arrives. The long read timeout covers model latency + tool calls (PHP max_execution_time=90).
    location = /api/v1/ai/chat {
        include snippets/afaq-proxy.conf;
        proxy_pass http://afaq_web;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        include snippets/afaq-proxy.conf;
        proxy_pass http://afaq_web;
    }
}
