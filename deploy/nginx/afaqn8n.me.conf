# Host nginx — public site: https://afaqn8n.me (Next.js standalone on 127.0.0.1:3000)
# Install: see docs/06_testing_devops/deployment_docker.md §9.3

upstream afaq_frontend {
    server 127.0.0.1:3000;   # FRONTEND_PORT in /var/www/afaq/afaqn8n/.env
    keepalive 16;
}

# HTTP → HTTPS (Let's Encrypt renewals are answered before the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name afaqn8n.me www.afaqn8n.me;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://afaqn8n.me$request_uri; }
}

# www → apex
server {
    # `listen … ssl http2` works on Ubuntu's stock nginx (1.18 / 1.24)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.afaqn8n.me;

    ssl_certificate     /etc/letsencrypt/live/afaqn8n.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afaqn8n.me/privkey.pem;
    include snippets/afaq-ssl.conf;

    return 301 https://afaqn8n.me$request_uri;
}

server {
    # `listen … ssl http2` works on Ubuntu's stock nginx (1.18 / 1.24)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afaqn8n.me;

    ssl_certificate     /etc/letsencrypt/live/afaqn8n.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afaqn8n.me/privkey.pem;
    include snippets/afaq-ssl.conf;

    access_log /var/log/nginx/afaqn8n.me.access.log;
    error_log  /var/log/nginx/afaqn8n.me.error.log warn;

    client_max_body_size 2m;   # the site posts JSON to the API domain, not here

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/x-component;

    # Hashed, immutable build assets: Next already sends a 1-year immutable Cache-Control
    location ^~ /_next/static/ {
        include snippets/afaq-proxy.conf;
        proxy_pass http://afaq_frontend;
        access_log off;
    }

    location / {
        include snippets/afaq-proxy.conf;
        # Cache Components streams the dynamic parts of a page (React Server Components):
        # pass chunks straight through instead of buffering the whole response.
        proxy_buffering off;
        proxy_pass http://afaq_frontend;
    }
}
