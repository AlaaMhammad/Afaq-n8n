; Afaq — dev-only performance settings.
; Bind-mounted code on Windows/macOS makes every file stat expensive. Keep compiled scripts
; (including Blade views) in OPcache and re-check timestamps at most every 2 seconds.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
