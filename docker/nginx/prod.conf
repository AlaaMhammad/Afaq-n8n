# Production nginx inside the stack ("web" service): serves backend/public and hands PHP to FPM.
# TLS, HTTP/2 and the public hostname (dashboard.afaqn8n.me) are handled by the host nginx,
# which proxies here on 127.0.0.1:${WEB_PORT}. See deploy/nginx/dashboard.afaqn8n.me.conf.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # AI chat streams Server-Sent Events: never buffer (the app also sends X-Accel-Buffering: no)
    location = /api/v1/ai/chat {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
        gzip off;
    }

    # PHP runs in the backend container, where the code lives at the same path.
    location ~ \.php$ {
        try_files /index.php =404;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }

    # Published Filament assets (versioned via ?v= query strings)
    location ~* ^/(css|js|fonts)/filament/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Uploads (avatars, project covers) from the shared storage volume
    location ^~ /storage/ {
        location ~* \.(php|phtml|phar)$ { deny all; }
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known) { deny all; }
}
